name: voxaflow_flutter
description: Voxa Flow client SDK for Flutter — wraps livekit_client and the Voxa realtime/REST API (voice, video, chat, transcripts, AI events) with token auth and role-based capability gating.
version: 0.1.0
homepage: https://voxaflow.com
repository: https://github.com/bugpiper/voxaflow

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # Media transport (WebRTC). Pinned — test on every upgrade (see cross-platform spec).
  livekit_client: ^2.3.0
  # Voxa realtime channel (transcript / entities / suggestions / chat). Socket.IO v4 protocol.
  socket_io_client: ^2.0.3
  # REST (token mint/refresh, /rtc/token, chat, etc.)
  http: ^1.2.0
  # Native call UX: CallKit (iOS) + full-screen incoming UI / ConnectionService (Android).
  # Mobile-only — for web targets use @voxaflow/web-core instead.
  flutter_callkit_incoming: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
