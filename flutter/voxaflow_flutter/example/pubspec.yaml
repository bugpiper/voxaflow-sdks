name: voxaflow_example
description: "Voxa Flow Flutter SDK example — connect, start a call, stream the live transcript."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # The SDK under test (local path).
  voxaflow_flutter:
    path: ../
  # Runtime mic/camera permission prompts.
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
